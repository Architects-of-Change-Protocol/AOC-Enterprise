name: Publishability

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  publishability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout AOC Protocol (peer dependency)
        uses: actions/checkout@v4
        with:
          repository: Architects-of-Change-Protocol/Architects_of_Change_Protocol
          path: ../Architects_of_Change_Protocol
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run validate:publishability
