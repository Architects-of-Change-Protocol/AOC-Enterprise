name: Publishability

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  publishability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # validate-publishability.mjs falls back to the type-only stub at
      # tests/fixtures/protocol-stub when no @aoc/protocol sibling checkout is
      # present, and independently asserts no shipped artifact imports
      # @aoc/protocol at runtime. No Protocol checkout is needed here.
      - run: npm run validate:publishability

  protocol-tarball-consumption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Validate protocol-consumer.lock.json is well-formed
        run: npm run check:protocol-compatibility-lock
      - name: Read the pinned AOC Protocol commit from the compatibility lock
        id: lock
        run: echo "commit=$(node -e "console.log(require('./protocol-consumer.lock.json').commit)")" >> "$GITHUB_OUTPUT"
      - name: Build a reproducible @aoc/protocol tarball from the pinned commit
        env:
          AOC_PROTOCOL_REPO: https://github.com/Architects-of-Change-Protocol/Architects_of_Change_Protocol.git
          AOC_PROTOCOL_REF: ${{ steps.lock.outputs.commit }}
          AOC_PROTOCOL_TARBALL_OUT: ${{ runner.temp }}/protocol-tarball
        run: node scripts/protocol/build-protocol-tarball.mjs | tee "${{ runner.temp }}/protocol-tarball-result.json"
      - name: Verify the built tarball matches the compatibility lock (commit/version/checksum)
        run: node scripts/protocol/verify-tarball-against-lock.mjs "${{ runner.temp }}/protocol-tarball-result.json"
      - name: Validate Enterprise against the pinned tarball in an isolated copy
        # Blocking. The Protocol Contract Adoption sprint resolved all
        # previously-known contract-shape gaps (AocIdentityClaims ->
        # VerifiedActorClaims, ScopedAccessRequest.scope -> .requestedScope
        # with `action` moved to the Enterprise-owned
        # EnterpriseScopedAccessRequest extension, and AuditEventEnvelope via
        # an explicit toProtocolAuditEventEnvelope mapper) -- see "Known gaps"
        # in docs/integration/PROTOCOL_PACKAGE_CONSUMPTION.md, which now
        # records zero open gaps. This step must pass; do not reintroduce
        # continue-on-error without a documented, evidenced reason.
        run: |
          TARBALL=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('${{ runner.temp }}/protocol-tarball-result.json','utf8')).tarballPath)")
          node scripts/protocol/validate-enterprise-against-protocol-tarball.mjs "$TARBALL"
